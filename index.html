<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF3F1">
<meta name="apple-mobile-web-app-title" content="美容台帳">
<meta name="description" content="美容の予約・費用・施術内容を記録するビューティ台帳">
<title>beauty-log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* soft blush ledger パレット */
  --bg: #FBF3F1;            /* 淡いブラッシュの背景 */
  --bg-outer: #E7D9D7;      /* PC外側 */
  --card: #FFFFFF;
  --card-2: #FCF6F5;

  --rose: #CB9AA0;          /* ダスティローズ（差し色） */
  --rose-deep: #B5878D;     /* 濃いめのローズ（選択・強調） */
  --rose-line: #C68E95;     /* 線画アイコンの色 */
  --mauve: #9A797C;         /* くすんだモーヴ（見出し文字） */
  --pill: #F4DFE2;          /* 淡ピンクのピル */
  --pill-2: #F7E7E9;

  --ink: #6E585B;           /* 本文 */
  --ink-2: #9C888B;         /* 補助 */
  --ink-3: #C6B4B5;         /* 三次 */
  --sun: #CE8A90;
  --sat: #8A97B2;
  --hairline: #F0E2E1;
  --hairline-2: #F6ECEB;
  --done: #A98C8F;          /* 来店済みの落ち着いたローズ */

  --fm: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
  --fg: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  --fn: 'Cormorant Garamond', 'Shippori Mincho', serif;
  --fw: 'Cormorant Garamond', serif;  /* wordmark */
  --r: 22px;
  --r-sm: 15px;
  --shadow: 0 2px 5px rgba(150,110,115,0.05), 0 12px 26px rgba(150,110,115,0.09);
  --shadow-sm: 0 1px 3px rgba(150,110,115,0.05), 0 6px 14px rgba(150,110,115,0.07);
  --nav-h: 68px;
  --top-h: 52px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  font-family: var(--fm);
  color: var(--ink);
  background: var(--bg-outer);
  -webkit-font-smoothing: antialiased;
  line-height: 1.7;
  display: flex; justify-content: center; align-items: stretch;
}

/* ============ アプリ枠 ============ */
.app {
  position: relative;
  width: 100%; max-width: 430px; height: 100dvh;
  background: var(--bg);
  overflow: hidden; display: flex; flex-direction: column;
}
@media (min-width: 480px) {
  body { padding: 22px 0; align-items: center; }
  .app {
    height: min(920px, calc(100dvh - 44px));
    border-radius: 40px;
    box-shadow: 0 30px 70px rgba(120,80,85,0.24), 0 6px 20px rgba(120,80,85,0.14);
    border: 1px solid rgba(255,255,255,0.6);
  }
}

/* ============ 共通トップヘッダー ============ */
.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 30;
  height: calc(var(--top-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 14px 0;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(251,243,241,0.86);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.topbar .tb-btn {
  width: 40px; height: 40px; border: none; background: transparent;
  color: var(--mauve); cursor: pointer; display: grid; place-items: center; border-radius: 50%;
}
.topbar .tb-btn:active { background: var(--pill-2); }
.topbar .tb-btn svg { width: 21px; height: 21px; }
.wordmark {
  font-family: var(--fw); font-weight: 500; font-size: 24px; letter-spacing: .04em;
  color: var(--mauve);
}

/* ============ スクロール領域 ============ */
.scroll-area {
  position: relative; z-index: 1; flex: 1 1 auto;
  overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding-top: calc(var(--top-h) + env(safe-area-inset-top) + 8px);
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);
}
.scroll-area::-webkit-scrollbar { width: 0; }
.wrap { padding: 4px 18px 8px; }

.panel { display: none; }
.panel.active { display: block; animation: riseIn .3s cubic-bezier(.22,1,.36,1); }
@keyframes riseIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .panel.active { animation: none; } }

/* ============ SVGアイコン基盤 ============ */
.ico { display: block; width: 100%; height: 100%; }

/* ============ 見出し ============ */
.eyebrow {
  font-family: var(--fn); font-size: 11px; color: var(--rose); font-weight: 600;
  letter-spacing: .3em; text-transform: uppercase; margin: 2px 2px 12px;
}
.section-h {
  font-family: var(--fm); font-weight: 600; font-size: 14px; color: var(--mauve);
  letter-spacing: .08em; margin: 22px 2px 11px; display: flex; align-items: center; gap: 8px;
}
.section-h::before { content: ""; width: 14px; height: 1px; background: var(--rose); }

/* ============ カード ============ */
.card {
  background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 18px 17px; margin-bottom: 14px; position: relative;
  border: 1px solid rgba(203,154,160,0.08);
}
.card-label { font-family: var(--fn); font-size: 11px; color: var(--rose); letter-spacing: .26em; text-transform: uppercase; font-weight: 600; margin-bottom: 9px; }

/* ============ ホーム：次回予約 ============ */
.next-card {
  background: linear-gradient(150deg, #D3AAB0 0%, #B5878D 100%);
  color: #FCEFEF; overflow: hidden; border: none;
}
.next-card::after { content: ""; position: absolute; right: -36px; top: -36px; width: 150px; height: 150px; background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%); }
.next-card .card-label { color: rgba(252,239,239,0.85); }
.next-empty { color: rgba(252,239,239,0.9); font-size: 14px; padding: 6px 0; }
.next-icon { width: 34px; height: 34px; color: #FCEFEF; margin-bottom: 8px; opacity: .95; }
.next-store { font-family: var(--fm); font-weight: 700; font-size: 20px; color: #fff; letter-spacing: .03em; }
.next-treat { font-size: 13.5px; color: rgba(252,239,239,0.88); margin-top: 2px; }
.next-when { font-family: var(--fn); font-size: 15.5px; color: rgba(252,239,239,0.95); margin-top: 10px; }
.countdown { margin-top: 14px; padding-top: 13px; border-top: 1px solid rgba(255,255,255,0.28); display: flex; align-items: baseline; gap: 10px; }
.cd-num { font-family: var(--fn); font-weight: 600; font-size: 40px; line-height: 1; color: #fff; }
.cd-unit { font-size: 12px; color: rgba(252,239,239,0.9); letter-spacing: .1em; }
.cd-sub { font-family: var(--fn); font-size: 18px; color: rgba(252,239,239,0.92); }

/* ============ サマリー ============ */
.summary-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 6px; }
.sum-cell { background: var(--card); border-radius: var(--r-sm); box-shadow: var(--shadow-sm); padding: 14px 8px 12px; text-align: center; }
.sum-val { font-family: var(--fn); font-weight: 600; font-size: 25px; color: var(--rose-deep); line-height: 1.05; }
.sum-val .yen { font-size: 15px; margin-right: 1px; }
.sum-cap { font-size: 10.5px; color: var(--ink-2); letter-spacing: .04em; margin-top: 4px; }

/* ============ リスト行 ============ */
.row { background: var(--card); border-radius: var(--r-sm); box-shadow: var(--shadow-sm); padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.row:active { transform: scale(.99); }
.stamp { width: 42px; height: 42px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; background: var(--pill-2); color: var(--rose-line); }
.stamp svg { width: 22px; height: 22px; }
.stamp.done { background: var(--rose-deep); color: #FCEFEF; }
.row-main { flex: 1 1 auto; min-width: 0; }
.row-store { font-family: var(--fm); font-weight: 600; font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 12px; color: var(--ink-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-right { text-align: right; flex: 0 0 auto; }
.row-date { font-family: var(--fn); font-size: 15px; color: var(--rose-deep); font-weight: 500; }
.row-amt { font-family: var(--fn); font-size: 14px; color: var(--ink-2); }
.empty-note { text-align: center; color: var(--ink-3); font-size: 13px; padding: 22px 10px; }

/* ============ フィルタセグメント ============ */
.seg { display: flex; background: var(--card); border-radius: 999px; padding: 5px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
.seg button { flex: 1; border: none; background: transparent; font-family: var(--fm); font-size: 13px; color: var(--ink-2); padding: 8px 0; border-radius: 999px; cursor: pointer; letter-spacing: .04em; transition: .2s; }
.seg button.on { background: var(--pill); color: var(--rose-deep); font-weight: 600; }

/* ============ バッジ ============ */
.badge { display: inline-block; font-family: var(--fg); font-size: 10.5px; padding: 2px 9px; border-radius: 999px; letter-spacing: .03em; }
.badge.up { background: transparent; color: var(--rose-deep); border: 1px solid var(--rose); }
.badge.done { background: var(--pill-2); color: var(--done); border: 1px solid transparent; }

/* ============ 予約・記録カード ============ */
.rec-card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); margin-bottom: 13px; overflow: hidden; }
.rec-top { display: flex; gap: 12px; padding: 15px 15px 12px; }
.rec-body { flex: 1 1 auto; min-width: 0; }
.rec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; flex-wrap: wrap; }
.rec-store { font-family: var(--fm); font-weight: 700; font-size: 16.5px; color: var(--ink); }
.rec-treat { font-size: 13.5px; color: var(--ink-2); }
.rec-meta { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.rec-meta span { font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; }
.rec-meta .mi { width: 14px; height: 14px; color: var(--rose); }
.rec-meta b { font-family: var(--fn); font-size: 15px; color: var(--rose-deep); font-weight: 600; }
.rec-memo { font-size: 12.5px; color: var(--ink-2); margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--hairline); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.rec-photos { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 11px; }
.rec-thumb { width: 58px; height: 58px; border-radius: 10px; object-fit: cover; cursor: pointer; box-shadow: var(--shadow-sm); }
.rec-actions { display: flex; border-top: 1px solid var(--hairline-2); }
.rec-actions button { flex: 1; border: none; background: transparent; padding: 11px 4px; cursor: pointer; font-family: var(--fm); font-size: 12.5px; color: var(--mauve); letter-spacing: .03em; border-right: 1px solid var(--hairline-2); }
.rec-actions button:last-child { border-right: none; }
.rec-actions button.primary { color: var(--rose-deep); font-weight: 600; }
.rec-actions button.danger { color: #C07C7C; }
.rec-actions button:active { background: var(--pill-2); }

/* ============ サロンカード ============ */
.salon-card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); margin-bottom: 13px; overflow: hidden; }
.salon-top { display: flex; gap: 12px; padding: 15px 15px 13px; }
.salon-emoji { width: 46px; height: 46px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; background: var(--pill-2); color: var(--rose-line); }
.salon-emoji svg { width: 24px; height: 24px; }
.salon-body { flex: 1 1 auto; min-width: 0; }
.salon-name { font-family: var(--fm); font-weight: 700; font-size: 16.5px; color: var(--ink); }
.salon-cat { font-size: 11.5px; color: var(--rose); letter-spacing: .08em; }
.salon-stats { display: flex; gap: 16px; margin-top: 8px; }
.salon-stats div { font-size: 11px; color: var(--ink-2); }
.salon-stats b { font-family: var(--fn); font-size: 16px; color: var(--rose-deep); font-weight: 600; display: block; }
.salon-info { padding: 0 15px 12px; }
.salon-info a, .salon-info span { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--ink-2); padding: 3px 0; text-decoration: none; }
.salon-info a { color: var(--rose-deep); }
.salon-info .ic-s { width: 15px; height: 15px; color: var(--rose); flex: 0 0 auto; }
.salon-actions { display: flex; border-top: 1px solid var(--hairline-2); }
.salon-actions button { flex: 1; border: none; background: transparent; padding: 11px 4px; cursor: pointer; font-family: var(--fm); font-size: 12.5px; color: var(--mauve); border-right: 1px solid var(--hairline-2); }
.salon-actions button:last-child { border-right: none; }
.salon-actions button.danger { color: #C07C7C; }
.salon-actions button:active { background: var(--pill-2); }

/* ============ カレンダー ============ */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 14px; }
.cal-title { display: flex; align-items: baseline; gap: 8px; }
.cal-m { font-family: var(--fm); font-weight: 700; font-size: 26px; color: var(--ink); letter-spacing: .04em; }
.cal-y { font-family: var(--fn); font-size: 16px; color: var(--rose); font-weight: 500; }
.cal-nav { display: flex; gap: 7px; align-items: center; }
.cal-nav button { border: none; background: var(--card); color: var(--rose-deep); width: 36px; height: 36px; border-radius: 50%; font-size: 17px; cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow-sm); }
.cal-nav .today-pill { width: auto; padding: 0 15px; height: 36px; background: var(--pill); font-family: var(--fm); font-size: 12.5px; letter-spacing: .06em; box-shadow: none; }

/* カテゴリ凡例 */
.cat-legend { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 12px; }
.cl-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cl-circle { width: 42px; height: 42px; border-radius: 50%; background: var(--pill-2); color: var(--rose-line); display: grid; place-items: center; }
.cl-circle svg { width: 22px; height: 22px; }
.cl-label { font-size: 8.5px; color: var(--ink-2); text-align: center; line-height: 1.25; letter-spacing: -.01em; }
.cl-item { cursor: pointer; }
.cl-item:active .cl-circle { transform: scale(.94); }
.cl-item.on .cl-circle { background: var(--rose-deep); color: #FCEFEF; box-shadow: 0 4px 12px rgba(181,135,141,0.35); }
.cl-item.on .cl-label { color: var(--rose-deep); font-weight: 600; }
#cal-cat-list { margin-top: 4px; }

.cal-legend2 { display: flex; justify-content: center; gap: 20px; margin-bottom: 14px; font-size: 11px; color: var(--ink-2); }
.cal-legend2 span { display: inline-flex; align-items: center; gap: 6px; }
.samp { width: 15px; height: 15px; border-radius: 5px; display: inline-block; }
.samp.ring { background: transparent; border: 1.5px solid var(--rose); }
.samp.fill { background: #EBD3D6; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-dow { text-align: center; font-family: var(--fn); font-size: 12px; color: var(--ink-3); letter-spacing: .06em; padding-bottom: 4px; font-weight: 600; }
.cal-dow.sun { color: var(--sun); }
.cal-dow.sat { color: var(--sat); }
.cal-cell {
  aspect-ratio: 1 / 1.12; border-radius: 13px; background: var(--card);
  box-shadow: var(--shadow-sm); border: 1.5px solid transparent;
  padding: 6px 2px 3px; cursor: pointer; display: flex; flex-direction: column; align-items: center;
  position: relative; overflow: hidden;
}
.cal-cell.blank { background: transparent; box-shadow: none; cursor: default; }
.cal-cell.upcoming { border-color: var(--rose); }
.cal-cell.done { background: #EBD3D6; box-shadow: 0 3px 9px rgba(203,154,160,0.22); }
.cal-cell.today { background: var(--rose-deep); box-shadow: 0 5px 14px rgba(181,135,141,0.4); }
.cal-cell .dnum { font-family: var(--fn); font-size: 15px; color: var(--ink); font-weight: 500; line-height: 1.1; }
.cal-cell.sun .dnum { color: var(--sun); }
.cal-cell.sat .dnum { color: var(--sat); }
.cal-cell.done .dnum { color: var(--rose-deep); font-weight: 600; }
.cal-cell.today .dnum { color: #FCEFEF; font-weight: 600; }
.cal-marks { display: flex; align-items: center; justify-content: center; gap: 2px; margin-top: 3px; height: 15px; }
.cal-mark { width: 13px; height: 13px; color: var(--rose-line); }
.cal-cell.done .cal-mark { color: var(--rose-deep); }
.cal-cell.today .cal-mark { color: #FCEFEF; }
.cal-more { font-family: var(--fn); font-size: 9px; color: var(--ink-3); }
.cal-cell.done .cal-more { color: var(--mauve); }
.cal-cell.today .cal-more { color: rgba(252,239,239,0.85); }

/* ============ 集計 ============ */
.stat-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat-big { grid-column: 1 / -1; text-align: center; padding: 20px; }
.stat-big .sum-val { font-size: 40px; }
.stat-cell { text-align: center; }
.bar-row { margin-bottom: 12px; }
.bar-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.bar-label { font-size: 12.5px; color: var(--ink); display: inline-flex; align-items: center; gap: 7px; }
.bar-label .bi { width: 17px; height: 17px; color: var(--rose-line); }
.bar-val { font-family: var(--fn); font-size: 14px; color: var(--rose-deep); font-weight: 600; }
.bar-track { height: 9px; background: var(--pill-2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--rose), var(--rose-deep)); transition: width .5s cubic-bezier(.22,1,.36,1); }
.mbar-chart { display: flex; align-items: flex-end; justify-content: space-between; gap: 7px; height: 130px; padding-top: 8px; }
.mbar { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 5px; }
.mbar-fill { width: 66%; max-width: 26px; background: linear-gradient(180deg, var(--rose), var(--rose-deep)); border-radius: 6px 6px 3px 3px; min-height: 3px; transition: height .5s cubic-bezier(.22,1,.36,1); }
.mbar-fill.zero { background: var(--hairline); }
.mbar-lbl { font-family: var(--fn); font-size: 10px; color: var(--ink-2); }
.mbar-amt { font-family: var(--fn); font-size: 9.5px; color: var(--ink-3); height: 12px; }
.yr-sel { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
.yr-sel .yr-now { font-family: var(--fm); font-weight: 700; font-size: 22px; color: var(--ink); letter-spacing: .04em; }
.yr-sel .yr-now .yr-unit { font-size: 14px; color: var(--rose); margin-left: 3px; }
.yr-sel button { border: none; background: var(--card-2); color: var(--rose-deep); width: 36px; height: 36px; border-radius: 50%; font-size: 17px; cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow-sm); }
.yr-sel button:disabled { color: var(--ink-3); opacity: .45; cursor: default; box-shadow: none; }
.mini-stats { display: flex; gap: 14px; justify-content: space-around; margin-bottom: 6px; }
.mini-stats div { text-align: center; }
.mini-stats b { font-family: var(--fn); font-size: 21px; color: var(--rose-deep); font-weight: 600; display: block; line-height: 1.1; }
.mini-stats span { font-size: 10.5px; color: var(--ink-2); }
.sub-label { font-family: var(--fm); font-size: 12px; color: var(--mauve); letter-spacing: .06em; margin: 18px 2px 10px; }

/* ============ 下タブ ============ */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding: 6px 6px env(safe-area-inset-bottom);
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--hairline);
  display: flex;
}
.tabbar button {
  flex: 1; border: none; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-family: var(--fm); font-size: 10px; color: var(--ink-3); letter-spacing: .02em;
  border-radius: 16px; margin: 0 1px; transition: .2s;
}
.tabbar button .ti { width: 22px; height: 22px; color: var(--ink-3); transition: .2s; }
.tabbar button.on { background: var(--pill); color: var(--rose-deep); }
.tabbar button.on .ti { color: var(--rose-deep); }

/* ============ FAB ============ */

/* ============================================================
   IndexedDB
============================================================ */
const DB_NAME = 'biyou-daichou', DB_VER = 1;
let _db = null;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('salons')) db.createObjectStore('salons', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('records')) db.createObjectStore('records', { keyPath: 'id' });
    };
    r.onsuccess = e => { _db = e.target.result; res(_db); };
    r.onerror = e => rej(e.target.error);
  });
}
function idbAll(store) { return new Promise((res, rej) => { const r = _db.transaction(store, 'readonly').objectStore(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); }
function idbPut(store, val) { return new Promise((res, rej) => { const r = _db.transaction(store, 'readwrite').objectStore(store).put(val); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
function idbDel(store, id) { return new Promise((res, rej) => { const r = _db.transaction(store, 'readwrite').objectStore(store).delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
function idbClear(store) { return new Promise((res, rej) => { const r = _db.transaction(store, 'readwrite').objectStore(store).clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }

function parseDT(rec) { const t = rec.time && /^\d{2}:\d{2}$/.test(rec.time) ? rec.time : '00:00'; return new Date(`${rec.date}T${t}:00`); }

/* ============================================================
   写真（縮小してデータURL化）＋ライトボックス
============================================================ */
function downscaleImage(file, maxDim = 1280, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      if (Math.max(w, h) > maxDim) { const s = maxDim / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try { resolve(c.toDataURL('image/jpeg', quality)); } catch (e) { reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load error')); };
    img.src = url;
  });
}
function openPhoto(src) { $('#lightbox-img').src = src; $('#lightbox').classList.add('open'); }

function daysSince(ts) { return Math.floor((Date.now() - ts) / 86400000); }

    <div class="bb-txt"><b>バックアップのおすすめ</b><span>${lb ? `前回の書き出しから${daysSince(lb)}日経過。` : 'まだ書き出していません。'}機種変更や不具合に備えて保存を。</span></div>

function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));

}

function nextReservation() {

function recordsOn(dstr) { return records.filter(r => r.date === dstr); }
function renderCalendar() {
  $('#cat-legend').innerHTML = CAT_KEYS.map(k =>
    `<div class="cl-item ${k===calCatFilter?'on':''}" data-cat="${k}"><div class="cl-circle">${svgIcon(k)}</div><div class="cl-label">${CATS[k].label}</div></div>`
  ).join('');

  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  $('#cal-m').textContent = `${calMonth + 1}月`;
  $('#cal-y').textContent = calYear;

  let html = '';
  ['日','月','火','水','木','金','土'].forEach((d, i) => {
    html += `<div class="cal-dow ${i===0?'sun':''} ${i===6?'sat':''}">${d}</div>`;
  });
  for (let i = 0; i < startDow; i++) html += `<div class="cal-cell blank"></div>`;
  const tstr = todayStr();
  for (let d = 1; d <= daysInMonth; d++) {
    const dstr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(calYear, calMonth, d).getDay();
    const recs = recordsOn(dstr);
    const hasUpcoming = recs.some(r => r.status === 'upcoming');
    const hasDone = recs.some(r => r.status === 'done');
    const isToday = dstr === tstr;
    // 状態: 今日 > 来店済み(塗り) > これから(枠)。過去の来店も塗りで残る
    let stateCls = '';
    if (isToday) stateCls = 'today';
    else if (hasDone) stateCls = 'done' + (hasUpcoming ? ' upcoming' : '');
    else if (hasUpcoming) stateCls = 'upcoming';
    let marks = '';
    if (recs.length) {
      recs.slice(0, 2).forEach(r => { marks += `<span class="cal-mark">${svgIcon(r.category)}</span>`; });
      if (recs.length > 2) marks += `<span class="cal-more">+${recs.length-2}</span>`;
    }
    html += `<div class="cal-cell ${stateCls} ${dow===0?'sun':''} ${dow===6?'sat':''}" data-day="${dstr}">
      <span class="dnum">${d}</span>
      <div class="cal-marks">${marks}</div>
    </div>`;
  }
  $('#cal-grid').innerHTML = html;

  // カテゴリ絞り込みの履歴リスト（凡例アイコンのタップで表示）
  const listEl = $('#cal-cat-list');
  if (calCatFilter) {
    const recs = records.filter(r => r.category === calCatFilter).sort((a, b) => parseDT(b) - parseDT(a));
    listEl.innerHTML = `<div class="section-h">${CATS[calCatFilter].label}の履歴（${recs.length}件）</div>` +
      (recs.length ? recs.map(rowHTML).join('') : `<div class="empty-note">このカテゴリの記録はまだありません</div>`);
  } else {
    listEl.innerHTML = '';
  }
}

/* ============================================================
   集計
============================================================ */
function catBars(byCat) {
  const rows = CAT_KEYS.filter(k => byCat[k] > 0).sort((a, b) => byCat[b] - byCat[a]);
  if (!rows.length) return `<div class="empty-note">記録がまだありません</div>`;
  const mx = Math.max(1, ...rows.map(k => byCat[k]));
  return rows.map(k => {
    const pct = Math.round(byCat[k] / mx * 100);
    return `<div class="bar-row">
      <div class="bar-top">
        <span class="bar-label"><span class="bi">${svgIcon(k)}</span>${CATS[k].label}</span>
        <span class="bar-val">${yen(byCat[k])}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}
function renderStats() {
  const done = records.filter(r => r.status === 'done');
  const total = done.reduce((s, r) => s + (Number(r.amount)||0), 0);
  const yearNow = new Date().getFullYear();
  const yearSpend = done.filter(r => r.date.startsWith(yearNow + '-')).reduce((s, r) => s + (Number(r.amount)||0), 0);
  const withAmt = done.filter(r => Number(r.amount) > 0);
  const avg = withAmt.length ? Math.round(total / withAmt.length) : 0;
  const yenMan = v => v >= 10000 ? '¥' + (v/10000).toFixed(v%10000?1:0) + '万' : '¥' + yenNum(v);

  // 年の範囲
  const yrs = done.map(r => parseInt(r.date.slice(0,4), 10)).filter(Boolean);
  const minY = yrs.length ? Math.min(...yrs) : yearNow;
  const maxY = Math.max(yearNow, yrs.length ? Math.max(...yrs) : yearNow);
  if (statsYear < minY) statsYear = minY;
  if (statsYear > maxY) statsYear = maxY;

  // 年別合計（クロス年）
  const byYear = {};
  done.forEach(r => { const y = r.date.slice(0,4); byYear[y] = (byYear[y]||0) + (Number(r.amount)||0); });
  const yearBars = [];
  for (let y = minY; y <= maxY; y++) yearBars.push({ y, sum: byYear[y] || 0 });
  const maxYearSum = Math.max(1, ...yearBars.map(b => b.sum));

  // 選択年
  const yDone = done.filter(r => r.date.startsWith(statsYear + '-'));
  const yTotal = yDone.reduce((s, r) => s + (Number(r.amount)||0), 0);
  const yWith = yDone.filter(r => Number(r.amount) > 0);
  const yAvg = yWith.length ? Math.round(yTotal / yWith.length) : 0;
  const yByCat = {};
  yDone.forEach(r => { yByCat[r.category] = (yByCat[r.category]||0) + (Number(r.amount)||0); });
  const yMonths = [];
  for (let m = 0; m < 12; m++) {
    const key = `${statsYear}-${String(m+1).padStart(2,'0')}`;
    yMonths.push(yDone.filter(r => r.date.startsWith(key)).reduce((s, r) => s + (Number(r.amount)||0), 0));
  }
  const maxYMonth = Math.max(1, ...yMonths);

  // 累計カテゴリ
  const allByCat = {};
  done.forEach(r => { allByCat[r.category] = (allByCat[r.category]||0) + (Number(r.amount)||0); });

  let html = `
    <div class="stat-hero">
      <div class="card stat-big">
        <div class="card-label">Total Spending</div>
        <div class="sum-val"><span class="yen">¥</span>${yenNum(total)}</div>
        <div class="sum-cap">累計支出</div>
      </div>
      <div class="card stat-cell"><div class="sum-val"><span class="yen">¥</span>${yenNum(yearSpend)}</div><div class="sum-cap">${yearNow}年の支出</div></div>
      <div class="card stat-cell"><div class="sum-val"><span class="yen">¥</span>${yenNum(avg)}</div><div class="sum-cap">1回あたり平均</div></div>
    </div>`;

  // 選択年の詳細
  html += `<div class="card">
    <div class="yr-sel">
      <button id="stats-prev" ${statsYear<=minY?'disabled':''}>‹</button>
      <div class="yr-now">${statsYear}<span class="yr-unit">年</span></div>
      <button id="stats-next" ${statsYear>=maxY?'disabled':''}>›</button>
    </div>
    <div class="mini-stats">
      <div><b>¥${yenNum(yTotal)}</b><span>年間支出</span></div>
      <div><b>${yDone.length}</b><span>来店回数</span></div>
      <div><b>¥${yenNum(yAvg)}</b><span>1回平均</span></div>
    </div>
    <div class="sub-label">カテゴリ内訳</div>
    ${yDone.length ? catBars(yByCat) : `<div class="empty-note">この年の来店記録はありません</div>`}
    <div class="sub-label">月別の支出</div>
    <div class="mbar-chart">`;
  yMonths.forEach((sum, i) => {
    const h = sum > 0 ? Math.max(4, Math.round(sum / maxYMonth * 100)) : 2;
    html += `<div class="mbar"><div class="mbar-fill ${sum>0?'':'zero'}" style="height:${h}%"></div><div class="mbar-lbl">${i+1}</div></div>`;
  });
  html += `</div></div>`;

  // 累計の内訳
  html += `<div class="card"><div class="card-label">All Time · 累計の内訳</div>${catBars(allByCat)}</div>`;

  // 年別支出（複数年の比較）※一番下
  html += `<div class="card"><div class="card-label">Yearly · 年別支出</div><div class="mbar-chart">`;
  yearBars.forEach(b => {
    const h = b.sum > 0 ? Math.max(4, Math.round(b.sum / maxYearSum * 100)) : 2;
    html += `<div class="mbar"><div class="mbar-amt">${b.sum>0?yenMan(b.sum):''}</div><div class="mbar-fill ${b.sum>0?'':'zero'}" style="height:${h}%"></div><div class="mbar-lbl">${b.y}</div></div>`;
  });
  html += `</div></div>`;

  $('#stats-body').innerHTML = html;
  const pv = $('#stats-prev'), nx = $('#stats-next');
  if (pv) pv.addEventListener('click', () => { if (statsYear > minY) { statsYear--; renderStats(); } });
  if (nx) nx.addEventListener('click', () => { if (statsYear < maxY) { statsYear++; renderStats(); } });
}

    <div class="field two"><div><label>日付 *</label><input id="f-date" type="date" value="${esc(r.date)}"></div><div><label>時間</label><input id="f-time" type="time" value="${esc(r.time)}"></div></div>
    <div class="field"><label>施術内容</label><input id="f-treat" type="text" placeholder="例：カット＋カラー" value="${esc(r.treatment)}"></div>
    <div class="field"><label>金額（円）</label><input id="f-amount" type="number" inputmode="numeric" placeholder="例：12000" value="${r.amount!==''&&r.amount!=null?esc(r.amount):''}"></div>
    <div class="field"><label>ステータス</label><div class="status-pick" id="f-status"><button type="button" data-st="upcoming" class="${r.status==='upcoming'?'on':''}">これから</button><button type="button" data-st="done" class="${r.status==='done'?'on':''}">来店済み</button></div></div>
    <div class="field"><label>メモ（担当者・仕上がりなど）</label><textarea id="f-memo" placeholder="担当：○○さん / 前髪短め など">${esc(r.memo)}</textarea></div>
    <div class="field"><label>写真（仕上がり・デザインなど）</label><div class="photo-row" id="photo-row"></div><input type="file" id="photo-input" accept="image/*" style="display:none"><div class="hint">端末内に保存されます。タップで拡大できます。</div></div>
    <button class="btn-primary" id="f-save">${editing ? '保存する' : '追加する'}</button>
    <button class="btn-ghost" id="f-cancel">${editing ? 'キャンセル' : 'やめる'}</button>
  `);

  let curCat = r.category, curStatus = r.status;
  let curPhotos = (r.photos || []).slice();
  const photoRow = $('#photo-row');
  function renderPhotos() {
    photoRow.innerHTML = curPhotos.map((p, i) =>
      `<div class="photo-thumb-wrap"><img class="photo-thumb" src="${p}" data-view="${i}" alt="写真"><button type="button" class="photo-rm" data-rm="${i}" aria-label="削除">×</button></div>`
    ).join('') + `<button type="button" class="photo-add" id="photo-add"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10.5" r="1.6"/><path d="M4 17l4.5-4 3.5 3 3-2.5 5 4.5"/></svg>追加</button>`;
  }
  renderPhotos();
  photoRow.addEventListener('click', async e => {
    const add = e.target.closest('#photo-add');
    if (add) { $('#photo-input').click(); return; }
    const rm = e.target.closest('[data-rm]');
    if (rm) { curPhotos.splice(Number(rm.dataset.rm), 1); renderPhotos(); return; }
    const view = e.target.closest('[data-view]');
    if (view) { openPhoto(curPhotos[Number(view.dataset.view)]); }
  });
  $('#photo-input').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try { const data = await downscaleImage(file); curPhotos.push(data); renderPhotos(); }
    catch (err) { toast('画像を読み込めませんでした'); }
    e.target.value = '';
  });
  $('#catpick').addEventListener('click', e => { const chip = e.target.closest('.cat-chip'); if (!chip) return; curCat = chip.dataset.cat; document.querySelectorAll('#catpick .cat-chip').forEach(c => c.classList.toggle('on', c.dataset.cat === curCat)); });
  $('#f-status').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; curStatus = b.dataset.st; document.querySelectorAll('#f-status button').forEach(x => x.classList.toggle('on', x.dataset.st === curStatus)); });
  $('#f-salon').addEventListener('change', e => {
    const v = e.target.value;
    $('#new-salon-fields').style.display = (v === '__new__') ? '' : 'none';
    if (v === '__new__') { $('#ns-name').focus(); return; }
    const s = salons.find(x => x.id === v);
    if (s) { curCat = s.category; document.querySelectorAll('#catpick .cat-chip').forEach(c => c.classList.toggle('on', c.dataset.cat === curCat)); }
  });
  $('#f-cancel').addEventListener('click', closeSheet);
  $('#f-save').addEventListener('click', async () => {
    const date = $('#f-date').value;
    if (!date) { toast('日付を入力してください'); return; }
    let salonId = $('#f-salon').value || '';
    let store = '';
    let createdSalon = false;
    if (salonId === '__new__') {
      const name = $('#ns-name').value.trim();
      if (!name) { toast('新しいサロンの店名を入力してください'); return; }
      const dup = salons.find(x => x.name.trim() === name);
      if (dup) { salonId = dup.id; store = dup.name; }
      else {
        const ns = { id: uid(), name, category: curCat, phone: ($('#ns-phone').value || '').trim(), address: '', url: ($('#ns-url').value || '').trim(), memo: ($('#ns-memo').value || '').trim() };
        await idbPut('salons', ns); salons.push(ns); salonId = ns.id; store = ns.name; createdSalon = true;
      }
    } else if (salonId) {
      const s = salons.find(x => x.id === salonId);
      store = s ? s.name : '';
    } else if (r.store) {
      store = r.store;  // サロン未登録の既存記録は元のお店名を維持
    }
    if (!store) { toast('サロンを選んでください'); return; }
    const obj = { id: r.id || uid(), salonId, store, category: curCat, date, time: $('#f-time').value || '', treatment: $('#f-treat').value.trim(), amount: $('#f-amount').value === '' ? '' : Number($('#f-amount').value), status: curStatus, memo: $('#f-memo').value.trim(), photos: curPhotos };
    await idbPut('records', obj);
    const idx = records.findIndex(x => x.id === obj.id);
    if (idx >= 0) records[idx] = obj; else records.push(obj);
    closeSheet(); toast(createdSalon ? 'サロンも登録しました' : (editing ? '保存しました' : '追加しました')); refreshCurrent();
  });
}

function salonForm(salon) {
  const editing = !!salon;
  const s = salon || { id: null, name: '', category: 'hair', phone: '', address: '', url: '', memo: '' };
  openSheet(`
    <div class="sheet-title">${editing ? 'サロンを編集' : 'サロンを追加'}</div>
    <div class="sheet-sub">通っているお店を登録します</div>
    <div class="field"><label>店名 *</label><input id="s-name" type="text" placeholder="例：Salon de Plume" value="${esc(s.name)}"></div>
    <div class="field"><label>カテゴリ</label>${catPickerHTML(s.category)}</div>
    <div class="field"><label>電話番号</label><input id="s-phone" type="tel" inputmode="tel" placeholder="03-1234-5678" value="${esc(s.phone)}"></div>
    <div class="field"><label>住所</label><input id="s-address" type="text" placeholder="東京都..." value="${esc(s.address)}"></div>
    <div class="field"><label>予約サイトURL</label><input id="s-url" type="url" inputmode="url" placeholder="https://..." value="${esc(s.url)}"></div>
    <div class="field"><label>メモ（会員番号・営業時間・指名など）</label><textarea id="s-memo" placeholder="会員番号：1234 / 火曜定休 / 指名：○○">${esc(s.memo)}</textarea></div>
    <button class="btn-primary" id="s-save">${editing ? '保存する' : '追加する'}</button>
    <button class="btn-ghost" id="s-cancel">やめる</button>
  `);
  let curCat = s.category;
  $('#catpick').addEventListener('click', e => { const chip = e.target.closest('.cat-chip'); if (!chip) return; curCat = chip.dataset.cat; document.querySelectorAll('#catpick .cat-chip').forEach(c => c.classList.toggle('on', c.dataset.cat === curCat)); });
  $('#s-cancel').addEventListener('click', closeSheet);
  $('#s-save').addEventListener('click', async () => {
    const name = $('#s-name').value.trim();
    if (!name) { toast('店名を入力してください'); return; }
    const obj = { id: s.id || uid(), name, category: curCat, phone: $('#s-phone').value.trim(), address: $('#s-address').value.trim(), url: $('#s-url').value.trim(), memo: $('#s-memo').value.trim() };
    await idbPut('salons', obj);
    const idx = salons.findIndex(x => x.id === obj.id);
    if (idx >= 0) {
      salons[idx] = obj;
      for (const rec of records.filter(r => r.salonId === obj.id)) { rec.store = obj.name; rec.category = obj.category; await idbPut('records', rec); }
    } else salons.push(obj);
    closeSheet(); toast(editing ? '保存しました' : '追加しました'); refreshCurrent();
  });
}

function dayDetail(dstr) {
  const recs = recordsOn(dstr).sort((a, b) => parseDT(a) - parseDT(b));
  const items = recs.length ? recs.map(r => {
    const cat = CATS[r.category] || CATS.other;
    const done = r.status === 'done';
    return `<div class="day-rec" data-open-rec="${r.id}">
      <div class="stamp ${done?'done':''}">${svgIcon(r.category)}</div>
      <div class="row-main">
        <div class="row-store">${esc(r.store)} <span class="badge ${done?'done':'up'}">${done?'来店済み':'これから'}</span></div>
        <div class="row-sub">${r.time ? r.time + ' ・ ' : ''}${esc(r.treatment) || cat.label}${r.amount ? ' ・ ' + yen(r.amount) : ''}</div>
      </div>
    </div>`;
  }).join('') : `<div class="empty-note">この日の予定・記録はありません</div>`;
  openSheet(`
    <div class="sheet-title">${fmtDate(dstr)}</div>
    <div class="sheet-sub">この日の予定・記録</div>
    ${items}
    <button class="btn-primary" id="d-add">＋ この日に予約を追加</button>
    <button class="btn-ghost" id="d-close">閉じる</button>
  `);
  $('#d-close').addEventListener('click', closeSheet);
  $('#d-add').addEventListener('click', () => recordForm(null, { date: dstr }));
  $('#sheet').querySelectorAll('[data-open-rec]').forEach(el => { el.addEventListener('click', () => { const rec = records.find(r => r.id === el.dataset.openRec); if (rec) recordForm(rec); }); });
}

function settingsSheet() {
  openSheet(`
    <div class="sheet-title">データ管理</div>
    <div class="sheet-sub">この端末に保存されているデータ</div>
    <div class="card" style="text-align:center">
      <div class="salon-stats" style="justify-content:center;gap:26px">
        <div><b style="font-family:var(--fn);font-size:22px;color:var(--rose-deep)">${records.length}</b><div style="font-size:11px;color:var(--ink-2)">記録件数</div></div>
        <div><b style="font-family:var(--fn);font-size:22px;color:var(--rose-deep)">${salons.length}</b><div style="font-size:11px;color:var(--ink-2)">サロン数</div></div>
      </div>
    </div>
    <div class="field" style="margin-bottom:8px"><div class="hint" style="margin-top:0;font-size:12px;color:var(--ink-2)">最終バックアップ：${lastBackup() ? (daysSince(lastBackup()) === 0 ? '今日' : daysSince(lastBackup()) + '日前') : 'まだありません'}</div></div>
    <div class="field"><div class="hint" style="margin-top:0">データは端末内（IndexedDB）に保存され、アプリを閉じても消えません。機種変更の際はエクスポートしたJSONを新端末でインポートしてください。</div></div>
    <button class="btn-primary" id="ex-btn">JSONにエクスポート</button>
    <button class="btn-primary alt" id="im-btn" style="margin-top:10px">JSONをインポート</button>
    <input type="file" id="im-file" accept="application/json,.json" style="display:none">
    <button class="btn-ghost" id="set-close">閉じる</button>
  `);
  $('#set-close').addEventListener('click', closeSheet);
  $('#ex-btn').addEventListener('click', exportJSON);
  $('#im-btn').addEventListener('click', () => $('#im-file').click());
  $('#im-file').addEventListener('change', importJSON);
}
function exportJSON() {
  const data = { app: 'biyou-daichou', version: 1, exportedAt: new Date().toISOString(), salons, records };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `美容台帳_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000); toast('エクスポートしました');
  markBackup();
  const banner = $('#home-backup'); if (banner) renderBackupBanner();
}
async function importJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.salons) || !Array.isArray(data.records)) throw new Error('bad');
    if (!confirm('現在のデータを、読み込むファイルの内容で置き換えます。よろしいですか？')) { e.target.value = ''; return; }
    await idbClear('salons'); await idbClear('records');
    for (const s of data.salons) await idbPut('salons', s);
    for (const r of data.records) await idbPut('records', r);
    salons = await idbAll('salons'); records = await idbAll('records');
    closeSheet(); toast('インポートしました'); switchTab('home');
  } catch (err) { toast('読み込みに失敗しました'); }
  e.target.value = '';
}

/* ============================================================
   来店を記録（完了時に金額・メモを入力）
============================================================ */
function completeSheet(rec) {
  openSheet(`
    <div class="sheet-title">来店を記録</div>
    <div class="sheet-sub">${esc(rec.store)}・${fmtDate(rec.date)}</div>
    <div class="field"><label>金額（円）</label><input id="c-amount" type="number" inputmode="numeric" placeholder="例：12000" value="${rec.amount!==''&&rec.amount!=null?esc(rec.amount):''}"></div>
    <div class="field"><label>施術内容</label><input id="c-treat" type="text" placeholder="例：カット＋カラー" value="${esc(rec.treatment)}"></div>
    <div class="field"><label>メモ（仕上がり・担当など）</label><textarea id="c-memo" placeholder="担当：○○さん / 仕上がり◎">${esc(rec.memo)}</textarea></div>
    <button class="btn-primary" id="c-save">来店済みにする</button>
    <button class="btn-ghost" id="c-skip">金額を入れずに完了</button>
  `);
  async function finish(withInput) {
    if (withInput) {
      rec.amount = $('#c-amount').value === '' ? '' : Number($('#c-amount').value);
      rec.treatment = $('#c-treat').value.trim();
      rec.memo = $('#c-memo').value.trim();
    }
    rec.status = 'done';
    await idbPut('records', rec);
    closeSheet(); toast('来店済みにしました'); refreshCurrent();
  }
  $('#c-save').addEventListener('click', () => finish(true));
  $('#c-skip').addEventListener('click', () => finish(false));
}

/* ============================================================
   イベント委譲
============================================================ */
document.addEventListener('click', async e => {
  const t = e.target;
  if (t.classList && t.classList.contains('rec-thumb')) { openPhoto(t.src); return; }
  const openRec = t.closest('[data-open-rec]');
  if (openRec && !t.closest('.sheet')) { const rec = records.find(r => r.id === openRec.dataset.openRec); if (rec) recordForm(rec); return; }
  if (t.dataset.done) { const rec = records.find(r => r.id === t.dataset.done); if (rec) completeSheet(rec); return; }
  if (t.dataset.editRec) { const rec = records.find(r => r.id === t.dataset.editRec); if (rec) recordForm(rec); return; }
  if (t.dataset.delRec) { if (confirm('この記録を削除しますか？')) { await idbDel('records', t.dataset.delRec); records = records.filter(r => r.id !== t.dataset.delRec); toast('削除しました'); refreshCurrent(); } return; }
  if (t.dataset.editSalon) { const s = salons.find(x => x.id === t.dataset.editSalon); if (s) salonForm(s); return; }
  if (t.dataset.bookSalon) { const s = salons.find(x => x.id === t.dataset.bookSalon); if (s) recordForm(null, { salonId: s.id, store: s.name, category: s.category }); return; }
  if (t.dataset.delSalon) { if (confirm('このサロンを削除しますか？（関連する記録は残ります）')) { await idbDel('salons', t.dataset.delSalon); salons = salons.filter(s => s.id !== t.dataset.delSalon); toast('削除しました'); refreshCurrent(); } return; }
});

$('#cal-grid').addEventListener('click', e => { const cell = e.target.closest('.cal-cell'); if (!cell || cell.classList.contains('blank')) return; dayDetail(cell.dataset.day); });
$('#cat-legend').addEventListener('click', e => {
  const it = e.target.closest('.cl-item'); if (!it) return;
  calCatFilter = (calCatFilter === it.dataset.cat) ? null : it.dataset.cat;  // 同じアイコン再タップで解除
  renderCalendar();
});
$('#cal-prev').addEventListener('click', () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); });
$('#cal-next').addEventListener('click', () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); });
$('#cal-today').addEventListener('click', () => { const d = new Date(); calYear = d.getFullYear(); calMonth = d.getMonth(); renderCalendar(); });
$('#rec-seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; recFilter = b.dataset.f; renderRecords(); });
$('#fab').addEventListener('click', () => { const active = document.querySelector('.panel.active').id; if (active === 'tab-salon') salonForm(null); else recordForm(null); });
$('#tb-more').addEventListener('click', settingsSheet);
$('#tb-menu').addEventListener('click', settingsSheet);

function refreshCurrent() { switchTab(document.querySelector('.panel.active').id.replace('tab-', '')); }

setInterval(() => { if (document.querySelector('.panel.active').id === 'tab-home' && nextReservation()) renderHome(); }, 60000);

/* ============================================================
   初期化
============================================================ */
async function init() {
  const d = new Date(); calYear = d.getFullYear(); calMonth = d.getMonth();
  // OSにストレージを消さないよう要求（対応端末のみ）
  try { if (navigator.storage && navigator.storage.persist) { await navigator.storage.persist(); } } catch (e) {}
  try { await openDB(); salons = await idbAll('salons'); records = await idbAll('records'); }
  catch (err) { console.error('DB init failed', err); }
  renderHome();
}
init();

if ('serviceWorker' in navigator) {
  // 新バージョンが有効化されたら一度だけ自動リロード
  let _reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (_reloading) return; _reloading = true; window.location.reload();
  });
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
      const checkUpdate = () => { reg.update().catch(() => {}); };
      // 開き直し・前面復帰・再フォーカスのたびに更新を確認
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
      window.addEventListener('focus', checkUpdate);
      window.addEventListener('pageshow', checkUpdate);
      checkUpdate();
    } catch (e) {}
  });
}
</script>
</body>
</html>
